name: Fetch GSUBZ socials catalogue

# Temporary helper: GitHub runners have internet access (this repo's dev sandbox does
# not), so this job pulls the GSUBZ "Socials Media Market" service catalogue
# (gsubz.com/api/plans?service=socials), writes it into data/ and commits the result
# back to the branch it runs on.
#
# Runs once when this file is pushed, or on demand from the Actions tab.

on:
  push:
    paths:
      - ".github/workflows/fetch-gsubz-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download the catalogue JSON
        run: |
          set -euo pipefail
          for url in \
            "https://gsubz.com/api/plans?service=socials" \
            "https://api.gsubz.com/api/plans?service=socials"; do
            echo "== GET $url"
            if curl -4 -sS -L --retry 2 --max-time 120 \
                 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" \
                 -o /tmp/services-raw.json "$url" \
              && jq -e '.list | length > 0' /tmp/services-raw.json > /dev/null 2>&1; then
              echo "OK: $(jq '.list | length' /tmp/services-raw.json) services"
              exit 0
            fi
            echo "attempt failed"
          done
          echo "All attempts failed." >&2
          exit 1

      - name: Write data files
        run: |
          set -euo pipefail
          mkdir -p data
          jq '{
                form: {
                  phone_field: .phone_name,
                  amount_field: .amount_name,
                  email_field: .email_name,
                  plan_field: .plan_name
                },
                total: (.list | length),
                services: ([.list[] | {
                  id: .value,
                  category: .category,
                  name: .display_name,
                  price: (.price | tonumber),
                  min: .min,
                  max: .max,
                  description: (.description // "")
                }] | sort_by(.category, .name))
              }' /tmp/services-raw.json > data/gsubz-socials-services.json

          jq -r '(["id","category","name","price","min","max","description"],
                 (.services[] | [.id, .category, .name, .price, .min, .max, .description])) | @csv' \
            data/gsubz-socials-services.json > data/gsubz-socials-services.csv

          jq '[.services[] | {category, price}]
              | group_by(.category)
              | map({category: .[0].category,
                     services: length,
                     min_price: (map(.price) | min),
                     max_price: (map(.price) | max)})
              | sort_by(-.services)' \
            data/gsubz-socials-services.json > data/gsubz-socials-services-summary.json

          wc -c data/gsubz-socials-services.json data/gsubz-socials-services.csv
          echo "--- categories: $(jq 'length' data/gsubz-socials-services-summary.json) ---"
          jq -r '.[:20][] | "\(.services)\t\(.category)"' data/gsubz-socials-services-summary.json

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsubz-socials-services.json data/gsubz-socials-services.csv data/gsubz-socials-services-summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: GSUBZ socials media services catalogue (synced $(date -u +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          fi
