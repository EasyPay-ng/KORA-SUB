<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders — KORASTORE Admin</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="gate" class="gate"><div class="gate-card"><span class="gate-mark">K</span><h2>Checking admin access…</h2><p>Verifying your account before any store data loads.</p></div></div>
<div class="admin-shell" id="admin-content" hidden>
  <aside class="admin-side" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="page-head"><div><span class="eyebrow">Fulfilment</span><h1>Orders</h1><p>Move orders forward as you pack and ship. Cancelling refunds the full amount to the customer's wallet and restocks the items.</p></div></div>
    <section class="card">
      <div class="spread" style="margin-bottom:16px">
        <select id="filter" class="select" style="max-width:220px"><option value="open">Open orders</option><option value="all">All orders</option><option value="paid">Paid</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select>
        <small id="count" class="muted">Loading…</small>
      </div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer & delivery</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    </section>
  </main>
</div>
<script type="module">
  import { mountAdminSidebar, requireAdmin, watchAllOrders, watchAllUsers, setOrderStatus, naira, esc, formatDateTime, STATUS_LABEL, statusClass, NEXT_ORDER_ACTIONS } from './store.js';
  mountAdminSidebar('admin-orders.html');
  let orders = [], users = [];
  const filter = document.querySelector('#filter');
  function render() {
    const list = orders.filter(o => filter.value === 'all' || (filter.value === 'open' ? !['delivered', 'cancelled'].includes(o.status) : o.status === filter.value));
    document.querySelector('#count').textContent = `${list.length} order${list.length === 1 ? '' : 's'}`;
    document.querySelector('#rows').innerHTML = list.length ? list.map(o => {
      const u = users.find(x => x.id === o.uid);
      const d = o.delivery || {};
      const actions = (NEXT_ORDER_ACTIONS[o.status] || []).map(([status, label]) =>
        `<button class="btn btn-sm ${status === 'cancelled' ? 'btn-danger' : 'btn-ghost'}" data-order="${esc(o.id)}" data-status="${status}">${label}</button>`).join('');
      return `<tr>
        <td><b class="mono">${esc(o.id.slice(-8).toUpperCase())}</b><small>${esc(formatDateTime(o.createdAt))}</small></td>
        <td><b>${esc(u?.name || 'Customer')}</b><small>${esc([d.address, d.lga, d.state, d.country].filter(Boolean).join(', '))}</small></td>
        <td>${(o.items || []).map(i => `<small style="color:var(--ink)">${esc(i.name)} × ${i.quantity}</small>`).join('')}</td>
        <td class="mono"><b>${naira(o.total)}</b></td>
        <td><span class="badge ${statusClass(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span></td>
        <td><div class="table-actions">${actions || '<small class="muted">Closed</small>'}</div></td>
      </tr>`;
    }).join('') : '<tr><td colspan="6">No orders match this filter.</td></tr>';
  }
  filter.addEventListener('change', render);
  document.querySelector('#rows').addEventListener('click', async (event) => {
    const btn = event.target.closest('[data-order]');
    if (!btn) return;
    if (btn.dataset.status === 'cancelled' && !confirm('Cancel this order and refund the full amount to the customer wallet?')) return;
    btn.disabled = true;
    try { await setOrderStatus(btn.dataset.order, btn.dataset.status); }
    catch (problem) { alert(problem.message); btn.disabled = false; }
  });
  if (await requireAdmin('admin-orders.html')) {
    watchAllOrders(rows => { orders = rows; render(); });
    watchAllUsers(rows => { users = rows; render(); });
  }
</script>
</body>
</html>
