<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
  <div class="page-head"><div><span class="eyebrow">Your orders</span><h1>Track your orders</h1><p>Every purchase moves through paid, processing, shipped and delivered.</p></div></div>
  <div id="account-tabs"></div>
  <div id="notice"></div>
  <div id="orders"><div class="empty">Loading orders…</div></div>
</main>
<div id="site-footer"></div>
<script type="module">
  import { mountHeader, mountFooter, mountAccountTabs, requireCustomer, watchMyOrders, naira, esc, formatDateTime, formatDate, readParam, ORDER_STEPS, STATUS_LABEL, statusClass } from './store.js';
  mountHeader('orders.html');
  mountFooter();
  mountAccountTabs('orders.html');
  const user = await requireCustomer('orders.html');
  const placed = readParam('placed');
  if (placed) {
    document.querySelector('#notice').innerHTML = `<div class="notice ok"><span class="notice-icon">✓</span><div><b>Order placed</b>Reference ${esc(placed.slice(-8).toUpperCase())}. Your wallet was debited and the store is preparing it.</div></div>`;
  }
  const ORDER_LABEL = { paid: 'Paid', processing: 'Packing', shipped: 'On the way', delivered: 'Delivered' };
  watchMyOrders(user.uid, (rows) => {
    const host = document.querySelector('#orders');
    if (!rows.length) {
      host.innerHTML = '<div class="empty"><b>No orders yet</b>Once you buy something, it will appear here with live tracking.<br><a class="btn btn-gold" href="shop.html" style="margin-top:14px">Shop the catalogue</a></div>';
      return;
    }
    host.innerHTML = rows.map(o => {
      const cancelled = o.status === 'cancelled';
      const current = ORDER_STEPS.indexOf(o.status);
      const track = cancelled ? '' : `
        <div class="track">${ORDER_STEPS.map((_, i) => `<span class="${i <= current ? 'done' : ''}"></span>`).join('')}</div>
        <div class="track-labels">${ORDER_STEPS.map((s, i) => `<span class="${i === current ? 'now' : ''}">${ORDER_LABEL[s]}</span>`).join('')}</div>`;
      const d = o.delivery || {};
      return `
        <article class="order">
          <div class="order-head">
            <div><b>Order ${esc(o.id.slice(-8).toUpperCase())}</b><div class="small muted">${esc(formatDateTime(o.createdAt))}</div></div>
            <div class="row"><span class="badge ${statusClass(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span><b class="mono" style="color:var(--navy)">${naira(o.total)}</b></div>
          </div>
          ${track}
          <ul class="order-items">${(o.items || []).map(i => `<li><span>${esc(i.name)} × ${i.quantity}</span><span>${naira(i.lineTotal)}</span></li>`).join('')}</ul>
          <p class="small muted" style="margin:12px 0 0">Deliver to: ${esc([d.address, d.lga, d.state, d.country].filter(Boolean).join(', '))}${cancelled ? ' · Refunded to your wallet' : ''}</p>
        </article>`;
    }).join('');
  }, (error) => {
    document.querySelector('#orders').innerHTML = `<div class="empty"><b>Orders unavailable</b>${esc(error.message)}</div>`;
  });
</script>
</body>
</html>
