<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
  <div class="page-head"><div><span class="eyebrow">Your orders</span><h1>Track your orders</h1><p>Shipping is set by the store after you order. Keep browser alerts on so you receive the full items, service fee, shipping fee and total breakdown.</p></div><button class="btn btn-sm btn-ghost" id="alerts-btn">🔔 Turn on browser alerts</button></div>
  <div id="account-tabs"></div>
  <div id="notice"></div>
  <div id="orders"><div class="empty">Loading orders…</div></div>
  <h2 style="margin:30px 0 12px">Boosting orders</h2>
  <div id="boost-orders"><div class="empty">Loading boost orders…</div></div>
  <h2 style="margin:30px 0 12px">eSIM orders</h2>
  <div id="esim-orders"><div class="empty">Loading eSIM orders…</div></div>
</main>
<div id="site-footer"></div>
<script type="module">
  import { mountHeader, mountFooter, mountAccountTabs, requireCustomer, watchMyOrders, watchMyBoostOrders, watchMyEsimOrders, esimOrderLabel, payShippingFee, requestShopperAlerts, notificationState, showToast, naira, esc, formatDateTime, formatDate, readParam, ORDER_STEPS, STATUS_LABEL, statusClass, variantLabel, stationShortName } from './store.js';
  import { validityLabel } from './esim-catalogue.mjs';
  mountHeader('orders.html');
  mountFooter();
  mountAccountTabs('orders.html');
  const user = await requireCustomer('orders.html');
  const placed = readParam('placed');
  if (placed) {
    document.querySelector('#notice').innerHTML = `<div class="notice ok"><span class="notice-icon">✓</span><div><b>Order placed</b>Reference ${esc(placed.slice(-8).toUpperCase())}. Your wallet was debited for the items and service fee. The store will set shipping and notify you of the final total.</div></div>`;
  }
  const ORDER_LABEL = { paid: 'Paid', processing: 'Packing', shipped: 'On the way', delivered: 'Delivered' };
  const alertsButton = document.querySelector('#alerts-btn');
  function paintAlertsButton() {
    const state = notificationState();
    if (state === 'granted') { alertsButton.textContent = '🔔 Browser alerts on'; alertsButton.disabled = true; }
    else if (state === 'denied') { alertsButton.textContent = '🔕 Alerts blocked'; alertsButton.disabled = true; }
    else if (state === 'unsupported') alertsButton.hidden = true;
  }
  paintAlertsButton();
  alertsButton.addEventListener('click', async () => {
    alertsButton.disabled = true;
    alertsButton.textContent = 'Asking…';
    const result = await requestShopperAlerts();
    if (result === 'granted') showToast('Alerts on', 'We will notify you when the admin sets shipping for an order.');
    paintAlertsButton();
    if (result === 'default') alertsButton.disabled = false;
  });
  const orderHost = document.querySelector('#orders');

  orderHost.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-pay-shipping]');
    if (!button) return;
    button.disabled = true;
    button.textContent = 'Paying shipping…';
    try {
      await payShippingFee(button.dataset.payShipping);
    } catch (problem) {
      document.querySelector('#notice').innerHTML = `<div class="notice error"><span class="notice-icon">!</span><div><b>Shipping payment was not completed</b>${esc(problem.message || 'Please try again.')}</div></div>`;
      button.disabled = false;
      button.textContent = `Pay ${button.dataset.amount} shipping`;
    }
  });

  watchMyOrders(user.uid, (rows) => {
    if (!rows.length) {
      orderHost.innerHTML = '<div class="empty"><b>No orders yet</b>Once you buy something, it will appear here with live tracking.<br><a class="btn btn-gold" href="shop.html" style="margin-top:14px">Shop the catalogue</a></div>';
      return;
    }
    orderHost.innerHTML = rows.map(o => {
      const cancelled = o.status === 'cancelled';
      const current = ORDER_STEPS.indexOf(o.status);
      const track = cancelled ? '' : `
        <div class="track">${ORDER_STEPS.map((_, i) => `<span class="${i <= current ? 'done' : ''}"></span>`).join('')}</div>
        <div class="track-labels">${ORDER_STEPS.map((s, i) => `<span class="${i === current ? 'now' : ''}">${ORDER_LABEL[s]}</span>`).join('')}</div>`;
      const d = o.delivery || {};
      const shippingPending = !cancelled && o.shippingStatus === 'pending';
      const shippingFee = o.shippingFee;
      const amountDue = Number(o.amountDue || 0);
      const shippingRow = shippingPending
        ? '<li><span>Shipping fee</span><span class="badge wait">Set by store</span></li>'
        : `<li><span>Shipping fee</span><span>${shippingFee == null ? '—' : naira(shippingFee)}</span></li>`;
      const feeRows = `
        <li><span>Platform service fee</span><span>${naira(o.serviceFee || 0)}</span></li>
        ${shippingRow}
        <li class="order-total"><span>${shippingPending ? 'Current total' : 'Total'}</span><span>${naira(o.total)}</span></li>`;
      const paymentBox = amountDue > 0 ? `
        <div class="notice warn" style="margin-top:14px"><span class="notice-icon">!</span><div><b>Shipping payment due: ${naira(amountDue)}</b><small>Pay it from your wallet to complete this order. Your final total is ${naira(o.total)}.</small><button class="btn btn-gold btn-sm" data-pay-shipping="${esc(o.id)}" data-amount="${naira(amountDue)}" style="margin-top:10px">Pay ${naira(amountDue)} shipping</button></div></div>` : '';
      const shippingNote = shippingPending
        ? '<small class="badge wait">Shipping pending</small>'
        : (amountDue > 0 ? '<small class="badge wait">Shipping payment due</small>' : '');
      return `
        <article class="order">
          <div class="order-head">
            <div><b>Order ${esc(o.id.slice(-8).toUpperCase())}</b><div class="small muted">${esc(formatDateTime(o.createdAt))}</div></div>
            <div class="row"><span class="badge ${statusClass(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span>${shippingNote}<b class="mono" style="color:var(--navy)">${naira(o.total)}</b></div>
          </div>
          ${track}
          <ul class="order-items">${(o.items || []).map(i => `<li><span>${esc(i.name)}${variantLabel(i) ? ` · <small class="muted">${esc(variantLabel(i))}</small>` : ''} × ${i.quantity}</span><span>${naira(i.lineTotal)}</span></li>`).join('')}${feeRows}</ul>
          ${paymentBox}
          <p class="small muted" style="margin:12px 0 0">${d.stationId
            ? `Collect at: <b style="color:var(--navy)">${esc(stationShortName(d.stationName, 60))}</b>${d.stationAddress ? ` · ${esc(d.stationAddress)}` : ''}${d.landmark ? ` (near ${esc(d.landmark)})` : ''}${d.state ? ` · ${esc(d.state)}` : ''}`
            : `Deliver to: ${esc([d.address, d.lga, d.state, d.country].filter(Boolean).join(', '))}`}${cancelled ? ' · Refunded what had been paid to your wallet' : ''}</p>
        </article>`;
    }).join('');
  }, (error) => {
    orderHost.innerHTML = `<div class="empty"><b>Orders unavailable</b>${esc(error.message)}</div>`;
  });

  watchMyBoostOrders(user.uid, (rows) => {
    const host = document.querySelector('#boost-orders');
    if (!rows.length) {
      host.innerHTML = '<div class="empty"><b>No boost orders yet</b>Order a boost from the <a class="link" href="boost.html">boost page</a> and it will appear here.</div>';
      return;
    }
    host.innerHTML = rows.map(o => `
      <article class="order">
        <div class="order-head">
          <div><b>Boost ${esc(o.id.slice(-8).toUpperCase())}</b><div class="small muted">${esc(formatDateTime(o.createdAt))}</div></div>
          <div class="row"><span class="badge ${statusClass(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span><b class="mono" style="color:var(--navy)">${naira(o.total)}</b></div>
        </div>
        <ul class="order-items">
          <li><span>${esc(o.subcategoryName)}${o.unit ? ` <small class="muted">per ${Number(o.priceBasis) === 1000 ? '1,000 ' : ''}${esc(o.unit)}</small>` : ''} × ${o.quantity}</span><span>${naira(o.total)}</span></li>
          <li><span class="muted">Target</span><span class="small mono">${esc(o.link || '')}</span></li>
        </ul>
        <p class="small muted" style="margin:12px 0 0">${esc(o.platformName || '')}${o.categoryName ? ` · ${esc(o.categoryName)}` : ''}${o.status === 'cancelled' ? ' · Refunded to your wallet' : ''}</p>
      </article>`).join('');
  }, (error) => {
    document.querySelector('#boost-orders').innerHTML = `<div class="empty"><b>Boost orders unavailable</b>${esc(error.message)}</div>`;
  });

  watchMyEsimOrders(user.uid, (rows) => {
    const host = document.querySelector('#esim-orders');
    if (!rows.length) {
      host.innerHTML = '<div class="empty"><b>No eSIM orders yet</b>Buy travel data from the <a class="link" href="esim.html">eSIM page</a> and your activation details will appear here.</div>';
      return;
    }
    host.innerHTML = rows.map(o => `
      <article class="order">
        <div class="order-head">
          <div><b>eSIM ${esc(o.id.slice(-8).toUpperCase())}</b><div class="small muted">${esc(formatDateTime(o.createdAt))}</div></div>
          <div class="row"><span class="badge ${statusClass(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span><b class="mono" style="color:var(--navy)">${naira(o.total)}</b></div>
        </div>
        <ul class="order-items">
          <li><span>${esc(esimOrderLabel(o))} · ${esc(validityLabel(o.validityDays))} × ${Number(o.quantity || 1)}</span><span>${naira(o.total)}</span></li>
        </ul>
        ${o.instructions ? `<div class="notice ok" style="margin-top:14px"><span class="notice-icon">✓</span><div><b>Your activation details</b><small>${esc(o.instructions)}</small></div></div>` : ''}
        <p class="small muted" style="margin:12px 0 0">${o.status === 'cancelled'
          ? 'Cancelled — the full amount was refunded to your wallet.'
          : (o.status === 'delivered' ? 'Install over Wi-Fi. Do not delete the eSIM once it is working.' : 'We are preparing your eSIM and will send the activation details to your account email.')}</p>
      </article>`).join('');
  }, (error) => {
    document.querySelector('#esim-orders').innerHTML = `<div class="empty"><b>eSIM orders unavailable</b>${esc(error.message)}</div>`;
  });
</script>
</body>
</html>
