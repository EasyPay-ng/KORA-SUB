<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boost — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<main class="wrap page">
  <div class="empty" style="max-width:560px;margin:60px auto"><b>Taking you to the boost order form…</b><a class="link" id="boost-fallback" href="boost.html">Continue</a></div>
</main>
<script>
  // The per-platform pages were merged into one order form (boost.html).
  // Old links and bookmarks land here and are forwarded with the platform preselected.
  (function () {
    var id = new URLSearchParams(window.location.search).get('id');
    var target = 'boost.html' + (id ? '?platform=' + encodeURIComponent(id) : '');
    document.getElementById('boost-fallback').href = target;
    window.location.replace(target);
  })();
</script>
</body>
</html>
