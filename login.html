<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="44" height="44"><span class="brand-text"><b style="color:#fff">KORASTORE</b><small>Find it. Fund it. Own it.</small></span></a>
    <div>
      <h1>Welcome back to <span>your wallet.</span></h1>
      <p>Sign in to fund your account, check out with one tap and follow every order to your door.</p>
    </div>
    <p class="small" style="color:#8ea3c0">Protected by Firebase Authentication.</p>
  </aside>
  <main class="auth-form-wrap">
    <section class="auth-form">
      <a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="36" height="36"><span class="brand-text"><b>KORASTORE</b></span></a>
      <h2>Sign in</h2>
      <p>Use the email you registered with.</p>
      <form id="login-form" novalidate>
        <label class="field">Email address<input class="input" id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
        <label class="field">Password<input class="input" id="password" type="password" required autocomplete="current-password" placeholder="Your password"></label>
        <div id="error" class="error-text" role="alert" aria-live="polite"></div>
        <button id="submit" class="btn btn-block btn-lg" type="submit">Sign in →</button>
      </form>
      <div class="divider">or</div>
      <button id="google" class="btn btn-ghost btn-block" type="button">Continue with Google</button>
      <div class="auth-foot">New here? <a class="link" href="register.html">Create an account</a></div>
    </section>
  </main>
</div>
<script type="module">
  import { auth, googleProvider, signInWithPopup, signInWithEmailAndPassword, ensureUserProfile } from './store.js';
  const allowed = new Set(['dashboard.html', 'wallet.html', 'orders.html', 'profile.html', 'cart.html', 'shop.html']);
  const requested = new URLSearchParams(location.search).get('next');
  const destination = allowed.has(requested) ? requested : 'dashboard.html';
  const error = document.querySelector('#error');
  const submit = document.querySelector('#submit');
  const messages = {
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/user-not-found': 'No account was found for this email.',
    'auth/too-many-requests': 'Too many attempts. Wait a moment and try again.',
    'auth/popup-closed-by-user': 'The Google window closed before sign-in finished.'
  };
  async function finish(user) {
    await ensureUserProfile(user);
    location.replace(destination);
  }
  document.querySelector('#login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const result = await signInWithEmailAndPassword(auth, document.querySelector('#email').value.trim(), document.querySelector('#password').value);
      await finish(result.user);
    } catch (problem) {
      error.textContent = messages[problem?.code] || 'Unable to sign in. Check your connection and try again.';
      submit.disabled = false;
      submit.textContent = 'Sign in →';
    }
  });
  document.querySelector('#google').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    error.textContent = '';
    button.disabled = true;
    try {
      const result = await signInWithPopup(auth, googleProvider);
      await finish(result.user);
    } catch (problem) {
      error.textContent = messages[problem?.code] || 'Google sign-in did not complete.';
      button.disabled = false;
    }
  });
</script>
</body>
</html>
