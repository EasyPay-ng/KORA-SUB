<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funding — KORASTORE Admin</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="gate" class="gate"><div class="gate-card"><span class="gate-mark">K</span><h2>Checking admin access…</h2><p>Verifying your account before any store data loads.</p></div></div>
<div class="admin-shell" id="admin-content" hidden>
  <aside class="admin-side" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="page-head"><div><span class="eyebrow">Deposits</span><h1>Funding requests</h1><p>Confirm a request only after the matching transfer appears in the store account. Approving credits the customer's wallet once.</p></div></div>
    <section class="card">
      <div class="spread" style="margin-bottom:16px">
        <div class="row"><select id="filter" class="select" style="max-width:200px"><option value="pending">Pending</option><option value="all">All</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div>
        <small id="count" class="muted">Loading…</small>
      </div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Reference</th><th>Submitted</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    </section>
  </main>
</div>
<script type="module">
  import { mountAdminSidebar, requireAdmin, watchAllFunding, watchAllUsers, reviewFunding, naira, esc, formatDateTime, STATUS_LABEL, statusClass } from './store.js';
  mountAdminSidebar('admin-funding.html');
  let requests = [], users = [];
  const filter = document.querySelector('#filter');
  function render() {
    const list = requests.filter(r => filter.value === 'all' || r.status === filter.value);
    document.querySelector('#count').textContent = `${list.length} request${list.length === 1 ? '' : 's'}`;
    document.querySelector('#rows').innerHTML = list.length ? list.map(r => {
      const u = users.find(x => x.id === r.uid);
      return `<tr>
        <td><b>${esc(u?.name || 'Customer')}</b><small>${esc(u?.email || r.uid)}</small></td>
        <td class="mono">${esc(r.reference)}</td>
        <td>${esc(formatDateTime(r.createdAt))}</td>
        <td class="mono"><b>${naira(r.amount)}</b></td>
        <td><span class="badge ${statusClass(r.status)}">${esc(STATUS_LABEL[r.status] || r.status)}</span></td>
        <td>${r.status === 'pending' ? `<div class="table-actions"><button class="btn btn-sm btn-gold" data-act="approve" data-id="${esc(r.id)}">Approve</button><button class="btn btn-sm btn-danger" data-act="reject" data-id="${esc(r.id)}">Reject</button></div>` : `<small class="muted">${r.reviewedBy ? 'By ' + esc(r.reviewedBy) : ''}</small>`}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6">Nothing to show for this filter.</td></tr>';
  }
  filter.addEventListener('change', render);
  document.querySelector('#rows').addEventListener('click', async (event) => {
    const btn = event.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'reject' && !confirm('Reject this funding request? The customer will not be credited.')) return;
    btn.disabled = true;
    try { await reviewFunding(btn.dataset.id, btn.dataset.act); }
    catch (problem) { alert(problem.message); btn.disabled = false; }
  });
  if (await requireAdmin('admin-funding.html')) {
    watchAllFunding(rows => { requests = rows; render(); });
    watchAllUsers(rows => { users = rows; render(); });
  }
</script>
</body>
</html>
