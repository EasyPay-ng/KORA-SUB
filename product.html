<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
  <a class="link small" href="shop.html">← Back to shop</a>
  <div id="detail" style="margin-top:18px"><div class="empty"><b>Loading product…</b></div></div>
</main>
<div id="site-footer"></div>
<script type="module">
  import { mountHeader, mountFooter, getProduct, productMedia, productImages, priceHTML, productPrice, stockBadge, addToCart, esc, naira, readParam, showToast } from './store.js';
  mountHeader('shop.html');
  mountFooter();
  const host = document.querySelector('#detail');
  const id = readParam('id');
  let quantity = 1;
  let product = null;
  let galleryIndex = 0;
  let chosenVariant = '';

  function pickReady() {
    return !(product.variations || []).length || Boolean(chosenVariant);
  }

  function paint() {
    if (!product) return;
    const stock = Number(product.stock || 0);
    const minimum = Math.max(1, Number(product.minOrderQuantity || 1));
    const out = stock < minimum || product.active !== true;
    quantity = Math.max(minimum, Math.min(quantity, Math.max(minimum, stock)));
    const images = productImages(product);
    const ready = pickReady();
    host.innerHTML = `
      <div class="detail">
        <div class="detail-gallery">
          ${productMedia(product, 'detail-media', galleryIndex)}
          ${images.length > 1 ? `<div class="gallery-thumbs">${images.map((src, i) => `
            <button type="button" class="gallery-thumb ${i === galleryIndex ? 'on' : ''}" data-img="${i}" aria-label="Photo ${i + 1}"><img src="${esc(src)}" alt=""></button>`).join('')}</div>` : ''}
        </div>
        <div>
          <div class="row">
            <span class="product-cat">${esc(product.category || 'Store')}</span>
            ${product.recommended ? '<span class="badge gold">★ Recommended</span>' : ''}
          </div>
          <h1>${esc(product.name)}</h1>
          <div class="row">${stockBadge(product)}<span class="badge gold">Sold ${Number(product.sold || 0)}</span></div>
          ${chosenVariant && ready ? `<div class="price detail-price"><span>${naira(productPrice(product, chosenVariant))}</span></div>` : priceHTML(product, 'price detail-price')}
          <p class="desc">${esc(product.description || 'Details will be shared by the store admin.')}</p>
          ${(product.keywords || []).length ? `<div class="tags">${product.keywords.map(k => `<span class="tag">#${esc(k)}</span>`).join('')}</div>` : ''}
          <div class="small muted" style="margin-top:12px">Product ID: <span class="mono" style="color:var(--navy)">${esc(product.id)}</span></div>

          ${(product.variations || []).length ? `
            <div class="variant-block">
              <div class="small muted" style="margin-bottom:8px">Variation${chosenVariant ? '' : ' — pick one'}</div>
              <div class="variant-opts">${product.variations.map(v => `<button type="button" class="variant-opt ${v.name === chosenVariant ? 'on' : ''}" data-variant="${esc(v.name)}">${esc(v.name)} <small>${naira(v.price)}</small></button>`).join('')}</div>
            </div>` : ''}

          <div class="buy-box">
            <div class="row"><span class="small muted">Quantity · minimum ${minimum}</span>
              <div class="qty"><button type="button" data-q="-1" aria-label="Decrease" ${out ? 'disabled' : ''}>−</button><span>${quantity}</span><button type="button" data-q="1" aria-label="Increase" ${out ? 'disabled' : ''}>+</button></div>
            </div>
            <div class="row">
              <button class="btn btn-gold btn-lg" id="add" ${out || !ready ? 'disabled' : ''}>${out ? 'Currently unavailable' : (ready ? 'Add to cart' : 'Pick a variation above')}</button>
              <a class="btn btn-ghost btn-lg" href="cart.html">View cart</a>
            </div>
            <p class="small muted" style="margin:0">Pay from your KORASTORE wallet at checkout — the items price plus a platform service fee. Shipping is set by the admin after your order and you will be notified of the final breakdown.</p>
          </div>
        </div>
      </div>`;

    host.querySelectorAll('[data-img]').forEach(btn => btn.addEventListener('click', () => {
      galleryIndex = Number(btn.dataset.img);
      paint();
    }));
    host.querySelectorAll('[data-variant]').forEach(btn => btn.addEventListener('click', () => {
      chosenVariant = btn.dataset.variant;
      paint();
    }));
    host.querySelectorAll('[data-q]').forEach(btn => btn.addEventListener('click', () => {
      quantity = Math.max(minimum, Math.min(Math.max(minimum, stock), quantity + Number(btn.dataset.q)));
      paint();
    }));
    host.querySelector('#add')?.addEventListener('click', (event) => {
      addToCart(product.id, quantity, chosenVariant);
      event.currentTarget.textContent = 'Added to cart ✓';
      showToast('Added to cart', `${product.name}${chosenVariant ? ` · ${chosenVariant}` : ''}`);
    });
  }

  if (!id) {
    host.innerHTML = '<div class="empty"><b>No product selected</b>Open a product from the shop.</div>';
  } else {
    getProduct(id).then((data) => {
      if (!data || data.active !== true) {
        host.innerHTML = '<div class="empty"><b>This product is no longer listed</b><a class="btn btn-ghost" href="shop.html" style="margin-top:12px">Browse the shop</a></div>';
        return;
      }
      product = data;
      quantity = Math.max(1, Number(data.minOrderQuantity || 1));
      document.title = `${data.name} — KORASTORE`;
      paint();
    }).catch((error) => {
      host.innerHTML = `<div class="empty"><b>Product unavailable</b>${esc(error.message)}</div>`;
    });
  }
</script>
</body>
</html>
