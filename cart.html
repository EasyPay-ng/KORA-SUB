<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — KORASTORE</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><meta name="theme-color" content="#0b2545">
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
  <div class="page-head"><div><span class="eyebrow">Checkout</span><h1>Your cart</h1><p>Prices and stock are confirmed again by the store when you pay. Checkout adds a platform service fee and delivery to your items total.</p></div></div>
  <div id="notice"></div>
  <div class="cart-layout">
    <section class="card"><div class="card-head"><div><h2>Items</h2><small id="item-count">Loading…</small></div><a class="link small" href="shop.html">Keep shopping →</a></div><div id="lines"><div class="empty"><b>Loading…</b></div></div></section>
    <aside class="card" id="summary"></aside>
  </div>
</main>
<div id="site-footer"></div>
<script type="module">
  import { mountHeader, mountFooter, getCart, setCart, getProduct, productMedia, stockBadge, naira, esc, placeOrder, newRequestId, auth, onAuthStateChanged, watchProfile, watchFeeSettings, checkoutFees, variantLabel, DEFAULT_FEES } from './store.js';
  mountHeader('cart.html');
  mountFooter();
  const lines = document.querySelector('#lines');
  const summary = document.querySelector('#summary');
  const notice = document.querySelector('#notice');
  const countLabel = document.querySelector('#item-count');
  let products = new Map();
  let user = null;
  let profile = null;
  let wallet = 0;
  let fees = { ...DEFAULT_FEES };
  const pendingKey = 'korastore-checkout';

  function setNotice(kind, title, text) {
    notice.innerHTML = `<div class="notice ${kind}"><span class="notice-icon">${kind === 'ok' ? '✓' : '!'}</span><div><b>${esc(title)}</b>${esc(text)}</div></div>`;
  }

  function locationReady() {
    if (!profile) return false;
    if (!profile.country || !profile.state || !profile.address) return false;
    if (profile.country === 'Nigeria' && !profile.lga) return false;
    return true;
  }

  function totals() {
    let subtotal = 0;
    let count = 0;
    let problem = false;
    for (const item of getCart()) {
      const product = products.get(item.productId);
      if (!product || product.active !== true) { problem = true; continue; }
      subtotal += Number(product.price) * item.quantity;
      count += item.quantity;
      if (item.quantity > Number(product.stock || 0)) problem = true;
    }
    const feeParts = checkoutFees(subtotal, profile, fees);
    return { ...feeParts, count, problem };
  }

  function render() {
    const cart = getCart();
    const t = totals();
    countLabel.textContent = cart.length ? `${t.count} item${t.count === 1 ? '' : 's'} in your cart` : 'Your cart is empty';
    lines.innerHTML = cart.length ? cart.map((item, index) => {
      const p = products.get(item.productId);
      const variant = variantLabel(item);
      if (!p || p.active !== true) return `<div class="cart-line"><div class="cart-thumb" style="--tone:#8a94a6">?</div><div><b>No longer available</b><small class="muted" style="display:block">Remove this line to continue.${variant ? ` (${esc(variant)})` : ''}</small></div><button class="btn btn-sm btn-danger" data-remove="${index}">Remove</button></div>`;
      const stock = Number(p.stock || 0);
      return `<div class="cart-line">
        ${productMedia(p, 'cart-thumb')}
        <div><b>${esc(p.name)}</b>${variant ? `<div class="small muted">${esc(variant)}</div>` : ''}
          <div class="small muted">${naira(p.price)} each · ${stockBadge(p).replace('stock-tag', '')}</div>
          <div class="line-actions"><div class="qty"><button data-dec="${index}" aria-label="Decrease">−</button><span>${item.quantity}</span><button data-inc="${index}" aria-label="Increase" ${item.quantity >= stock ? 'disabled' : ''}>+</button></div>
          <button class="link small" style="background:none;border:0;cursor:pointer;color:var(--bad)" data-remove="${index}">Remove</button></div>
        </div>
        <div class="line-total">${naira(Number(p.price) * item.quantity)}</div>
      </div>`;
    }).join('') : `<div class="empty"><b>Nothing here yet</b>Browse the catalogue and add something you love.<br><a class="btn btn-gold" href="shop.html" style="margin-top:14px">Shop now</a></div>`;

    let action;
    if (!user) action = `<a class="btn btn-gold btn-lg btn-block" href="login.html?next=cart.html">Sign in to checkout</a>`;
    else if (!cart.length) action = '';
    else if (!locationReady()) action = `<a class="btn btn-gold btn-lg btn-block" href="profile.html">Add delivery location</a>`;
    else if (wallet < t.total) action = `<a class="btn btn-gold btn-lg btn-block" href="wallet.html">Fund your wallet (${naira(t.total - wallet)} short)</a>`;
    else action = `<button class="btn btn-gold btn-lg btn-block" id="checkout" ${t.problem ? 'disabled' : ''}>Pay ${naira(t.total)} from wallet</button>`;

    summary.innerHTML = `
      <div class="card-head"><div><h2>Order summary</h2><small>Paid from your KORASTORE wallet</small></div></div>
      ${user ? `<div class="wallet-pill"><div><small>Wallet balance</small><br><strong>${naira(wallet)}</strong></div><a class="btn btn-sm btn-ghost" href="wallet.html">Top up</a></div>` : ''}
      ${user && profile && cart.length ? `<div class="small muted" style="margin-bottom:12px">Delivering to <b style="color:var(--navy)">${esc([profile.address, profile.lga, profile.state, profile.country].filter(Boolean).join(', ') || 'your profile')}</b> · <a class="link" href="profile.html">change</a></div>` : ''}
      <div class="summary-row"><span>Items</span><span>${t.count}</span></div>
      <div class="summary-row"><span>Items subtotal</span><span>${naira(t.subtotal)}</span></div>
      <div class="summary-row"><span>Platform service fee</span><span>${naira(t.serviceFee)}</span></div>
      <div class="summary-row"><span>${esc(t.deliveryLabel)}</span><span>${naira(t.deliveryFee)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${naira(t.total)}</span></div>
      <div style="margin-top:14px">${action}</div>
      ${t.problem ? '<p class="small" style="color:var(--bad);margin:12px 0 0">Some items are unavailable or exceed stock. Adjust your cart.</p>' : ''}`;
  }

  lines.addEventListener('click', (event) => {
    const cart = getCart();
    const inc = event.target.closest('[data-inc]');
    const dec = event.target.closest('[data-dec]');
    const rem = event.target.closest('[data-remove]');
    if (rem) {
      cart.splice(Number(rem.dataset.remove), 1);
      setCart(cart);
      return render();
    }
    if (inc || dec) {
      const index = Number((inc || dec).dataset.inc ?? (inc || dec).dataset.dec);
      const item = cart[index];
      if (item) {
        const stock = Number(products.get(item.productId)?.stock || 0);
        item.quantity = Math.max(1, Math.min(stock || 1, item.quantity + (inc ? 1 : -1)));
        setCart(cart);
      }
    }
    render();
  });

  summary.addEventListener('click', async (event) => {
    const button = event.target.closest('#checkout');
    if (!button) return;
    const cart = getCart();
    const items = cart.map(i => ({ productId: i.productId, quantity: i.quantity, size: i.size || '', color: i.color || '' }));
    // Reuse the same request ID for retries of the same basket, so a lost response never double-charges.
    const signature = JSON.stringify(items);
    let pending = null;
    try { pending = JSON.parse(sessionStorage.getItem(pendingKey) || 'null'); } catch {}
    const requestId = pending && pending.signature === signature ? pending.requestId : newRequestId();
    sessionStorage.setItem(pendingKey, JSON.stringify({ requestId, signature }));
    button.disabled = true;
    button.textContent = 'Processing payment…';
    try {
      const result = await placeOrder(requestId, items);
      sessionStorage.removeItem(pendingKey);
      setCart([]);
      location.replace(`orders.html?placed=${encodeURIComponent(result.orderId)}`);
    } catch (error) {
      setNotice('error', 'Payment was not completed', error.message);
      button.disabled = false;
      button.textContent = 'Try again';
      await refresh();
    }
  });

  async function refresh() {
    const ids = [...new Set(getCart().map(i => i.productId))];
    const fetched = await Promise.all(ids.map(id => getProduct(id).catch(() => null)));
    products = new Map(fetched.filter(Boolean).map(p => [p.id, p]));
    render();
  }

  window.addEventListener('korastore:cart', refresh);
  watchFeeSettings((data) => { fees = data; render(); });
  onAuthStateChanged(auth, (current) => {
    user = current;
    if (!current) return render();
    // The profile document holds both the delivery location and the server-managed wallet balance.
    watchProfile(current.uid, (data) => { profile = data; wallet = Number(data.balance || 0); render(); });
  });
  refresh();
</script>
</body>
</html>
