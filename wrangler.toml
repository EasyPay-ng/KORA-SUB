name = "kora-sub"
main = "worker/index.js"
compatibility_date = "2026-10-08"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "korasub-eb0b8"
ADMIN_EMAIL = "beniwealth70@gmail.com"
# GitHub Pages site origin (path is not part of CORS Origin).
# Update this to https://korastore.name.ng (or your final domain) when it goes live.
FRONTEND_ORIGIN = "https://easypay-ng.github.io"

# Secrets are intentionally NOT [vars] entries. Set them with Wrangler:
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON   (paste the whole service-account JSON)

# Isolated values for Cloudflare's pull-request Worker Preview builds.
# These deliberately do not point at the production Firebase project or frontend.
[previews.vars]
FIREBASE_PROJECT_ID = "korasub-preview"
ADMIN_EMAIL = "preview@example.invalid"
FRONTEND_ORIGIN = "https://preview.example.invalid"
